# Per-team ceilings. They count pod *requests* (half of limits, see platform_api/manifests.py).
# Sized so one default 2-worker training job fits (1.3 CPU / 3272Mi) but two 1-worker jobs
# don't (2 x 2504Mi), and so both teams together stay within the node (4 vCPU, 15 GB).
# The API admits whole jobs against these numbers; Kubernetes enforces them per pod as a backstop.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
  namespace: team-a
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    count/rayjobs.ray.io: "3"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
  namespace: team-b
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    count/rayjobs.ray.io: "3"
---
# Pods created without resources still get requests, so they still count against the quota.
apiVersion: v1
kind: LimitRange
metadata:
  name: team-defaults
  namespace: team-a
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi}
      default: {cpu: 500m, memory: 512Mi}
      max: {cpu: "2", memory: 4Gi}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: team-defaults
  namespace: team-b
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi}
      default: {cpu: 500m, memory: 512Mi}
      max: {cpu: "2", memory: 4Gi}
