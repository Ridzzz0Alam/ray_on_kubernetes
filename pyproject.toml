[project]
name = "ray-on-kubernetes"
version = "0.1.0"
description = "Self-service ML platform on Kubernetes with KubeRay: job API, SDK, Ray Train/Serve, multi-tenancy."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "kubernetes>=37.0.2",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "typer>=0.29.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17",
]

[project.scripts]
rkp = "sdk.cli:main"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_api", "sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["k8s: needs a running kind cluster (run with `make test-k8s`)"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
