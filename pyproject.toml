[project]
name = "ray-on-kubernetes"
version = "0.1.0"
description = "Self-service ML platform on Kubernetes with KubeRay: job API, SDK, Ray Train/Serve, multi-tenancy."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["k8s: needs a running kind cluster (run with `make test-k8s`)"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
